apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: minishop
  labels: {app: backend}
spec:
  type: ClusterIP
  selector: {app: backend}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: minishop
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: backend
          image: ghcr.io/hadi-alawieh/minishop-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_HTTP_PORTS
              valueFrom:
                configMapKeyRef: {name: minishop-config, key: ASPNETCORE_HTTP_PORTS}
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef: {name: minishop-config, key: REDIS_URL}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: minishop-db, key: DATABASE_URL}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 45
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
